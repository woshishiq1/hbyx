name: Auto Merge IP List

on:
  schedule:
    # 每 3 小时运行一次
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行合并脚本
        run: |
          python process_ip.py

      - name: 提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output.txt
          git commit -m "Auto merge multi-source IPs: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git push
