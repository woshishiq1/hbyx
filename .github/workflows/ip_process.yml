name: Auto Process IP List (GeoLite2)

on:
  schedule:
    # 每天 UTC 时间 0:00（即北京时间每天 08:00）自动运行
    - cron: '0 0 * * *'
  # 支持在 GitHub Actions 界面手动点按钮运行
  workflow_dispatch:

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 检出当前仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装 Python 依赖包
        run: |
          python -m pip install --upgrade pip
          pip install requests geoip2

      - name: 运行 IP 处理脚本
        run: |
          python process_ip.py

      - name: 自动提交更新到 GitHub 仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output.txt
          git commit -m "Auto update formatted IP list: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" || exit 0
          git push
